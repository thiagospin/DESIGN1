
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - TechSolutions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            margin: 0;
            padding: 30px 15px;
        }

        .pagina {
            background-color: white;
            width: 600px;
            max-width: 100%;
            margin: 0 auto;
            padding: 25px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 5px;
        }

        .introducao {
            color: #596579;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .grupo {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #dce2ea;
        }

        .grupo h2 {
            color: #245b91;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .grupo p {
            color: #374151;
            margin: 5px 0;
            line-height: 1.5;
        }

        .grupo:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="pagina">

        <h1>Entre em contato</h1>

        <p class="introducao">
            Estamos disponíveis para atender você.
        </p>

        <div class="grupo">
            <h2>Comercial</h2>
            <p>Email: comercial@techsolutions.com</p>
            <p>Telefone: (21) 3333-4444</p>
        </div>

        <div class="grupo">
            <h2>Suporte técnico</h2>
            <p>Email: suporte@techsolutions.com</p>
            <p>Telefone: (21) 3333-5555</p>
        </div>

        <div class="grupo">
            <h2>Endereço</h2>
            <p>Av. das Américas, 500</p>
            <p>Rio de Janeiro - RJ</p>
        </div>

    </div>

</body>
</html>
