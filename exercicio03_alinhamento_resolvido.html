
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef1f5;
            margin: 0;
            padding: 40px 20px;
        }

        .cartao {
            background-color: white;
            width: 320px;
            max-width: 100%;
            padding: 25px;
            margin: 0 auto;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .foto {
            background-color: #dce7f4;
            height: 100px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #315b88;
        }

        h1 {
            color: #202b3c;
            font-size: 26px;
            margin-bottom: 5px;
        }

        h3 {
            color: #315b88;
            font-size: 16px;
            margin-top: 0;
        }

        .descricao {
            color: #4b5563;
            line-height: 1.5;
        }

        .contato {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            color: #374151;
        }

        .icone {
            width: 25px;
            text-align: center;
            color: #315b88;
        }

        .botao {
            background-color: #315b88;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 20px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="cartao">

        <div class="foto">👤</div>

        <h1>Mariana Costa</h1>

        <h3>Estudante de Design</h3>

        <p class="descricao">
            Gosto de criar interfaces digitais,
            explorar cores e desenvolver soluções criativas.
        </p>

        <hr>

        <div class="contato">
            <span class="icone">✉</span>
            <span>mariana@email.com</span>
        </div>

        <div class="contato">
            <span class="icone">◎</span>
            <span>@marianadesign</span>
        </div>

        <p class="botao">Entrar em contato</p>

    </div>

</body>
</html>
